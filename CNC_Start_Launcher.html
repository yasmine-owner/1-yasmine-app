
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Lathe Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #071321;
    color: white;
    font-family: Arial, sans-serif;
}

#startScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
}

#startScreen img {
    width: 100%;
    max-width: 950px;
    height: auto;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 12px;
}

#startButton {
    margin-top: 20px;
    padding: 15px 45px;
    border: none;
    border-radius: 10px;
    background: #f2a51b;
    color: #111;
    font-size: 21px;
    font-weight: bold;
}

#filePicker {
    display: none;
}

#status {
    margin-top: 15px;
    color: #ddd;
    font-size: 14px;
}

#programScreen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: white;
}

#programFrame {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div id="startScreen">

    <img src="splash.png" alt="CNC Lathe Simulator">

    <button id="startButton">
        ابدأ البرنامج
    </button>

    <input
        type="file"
        id="filePicker"
        accept=".html,.htm,text/html"
    >

    <div id="status">
        اضغط ابدأ لاختيار برنامج المحاكاة
    </div>

</div>

<div id="programScreen">
    <iframe id="programFrame"></iframe>
</div>

<script>

const startButton =
document.getElementById("startButton");

const filePicker =
document.getElementById("filePicker");

const startScreen =
document.getElementById("startScreen");

const programScreen =
document.getElementById("programScreen");

const programFrame =
document.getElementById("programFrame");

const status =
document.getElementById("status");


startButton.addEventListener("click", function() {
    filePicker.click();
});


filePicker.addEventListener("change", function() {

    const file = filePicker.files[0];

    if (!file) {
        return;
    }

    if (!file.name.toLowerCase().endsWith(".html") &&
        !file.name.toLowerCase().endsWith(".htm")) {

        status.textContent =
        "من فضلك اختر ملف HTML صحيح";

        return;
    }

    status.textContent = "جاري تحميل البرنامج...";

    const reader = new FileReader();

    reader.onload = function(event) {

        programFrame.srcdoc = event.target.result;

        startScreen.style.display = "none";
        programScreen.style.display = "block";

    };

    reader.onerror = function() {

        status.textContent =
        "تعذر قراءة الملف، حاول مرة أخرى";

    };

    reader.readAsText(file);

});

</script>

</body>
</html>
