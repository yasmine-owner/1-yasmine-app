name: Build Android APK

on:
  push:
    branches:
      - main # أو اسم الفرع الخاص بك (مثل master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      # تم إصلاح هذه الخطوة لكتابة ملف package.json بطريقة بسيطة وصحيحة 100%
      - name: Generate Dummy Package.json for Plain HTML
        run: |
          cat << 'EOF' > package.json
          {
            "name": "cnc-app",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'Plain HTML App - No Build Required'"
            }
          }
          EOF

      # سيتم الآن تنفيذ تثبيت الحزم بنجاح دون أخطاء JSON
      - name: Install Dependencies
        run: npm install

      - name: Build Web App Step
        run: npm run build

      - name: Setup Java Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          echo "Building APK..."
          # إذا كنت تستخدم أداة معينة (مثل Cordova أو Capacitor) قم بكتابة أمرها هنا

      - name: Upload Android APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ./**/*.apk
