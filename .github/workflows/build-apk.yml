name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project (newest zip by name)
        run: |
          ZIP=$(ls *.zip | sort | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d app_src
          DIR=$(dirname "$(find app_src -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install --legacy-peer-deps

      - name: Type check (information only, never blocks the build)
        run: |
          cd "$APP_DIR"
          npx tsc --noEmit > "$GITHUB_WORKSPACE/typecheck.log" 2>&1 || true
          echo "Type errors: $(grep -c 'error TS' "$GITHUB_WORKSPACE/typecheck.log" || true)"

      - name: Upload type check log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Build web app
        run: |
          cd "$APP_DIR"
          npm run build

      - name: Add Android platform
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android

      - name: Android native tweaks (zoom and print to PDF)
        run: |
          cd "$APP_DIR"
          MA=$(find android -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package' "$MA")
          cat > /tmp/body.java <<'JAVA'
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onStart() {
              super.onStart();
              final WebView wv = this.bridge.getWebView();
              WebSettings s = wv.getSettings();
              s.setSupportZoom(true);
              s.setBuiltInZoomControls(true);
              s.setDisplayZoomControls(false);
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void print() {
                  runOnUiThread(new Runnable() {
                    public void run() {
                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                      String name = "Factory_ERP_Report";
                      PrintDocumentAdapter adapter = wv.createPrintDocumentAdapter(name);
                      pm.print(name, adapter, new PrintAttributes.Builder().build());
                    }
                  });
                }
              }, "AndroidPrint");
            }
          }
          JAVA
          { echo "$PKG"; echo; cat /tmp/body.java; } > "$MA"
          cat "$MA"
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$MF"
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" /><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" /></manifest>#' "$MF"
          grep -c 'requestLegacyExternalStorage' "$MF"

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Factory-ERP-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
