name: Build Android APK with Cordova

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. إعداد بيئة Node.js و Java المطلوبة لـ Cordova والأندرويد
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. فك ضغط ملفات مشروع الويب وملفات كوردوفا تلقائياً عبر البحث عن الاسم
      - name: Extract Project Files Safely
        run: |
          # البحث وفك ضغط ملف كوردوفا أينما كان امتداده
          CORDOVA_FILE=$(find . -name "*cordova*" -type f | head -n 1)
          if [ -n "$CORDOVA_FILE" ]; then
            unzip -o "$CORDOVA_FILE" -d ./
          else
            echo "Cordova zip file not found!" && exit 1
          fi

          # البحث وفك ضغط ملف الويب splash أينما كان امتداده
          SPLASH_FILE=$(find . -name "*splash*.zip" -type f | head -n 1)
          if [ -n "$SPLASH_FILE" ]; then
            mkdir -p www
            unzip -o "$SPLASH_FILE" -d ./www || unzip -o "$SPLASH_FILE" -d ./
          else
            echo "Splash zip file not found, creating www folder if missing"
            mkdir -p www
          fi

      # 3. إنشاء ملف package.json تلقائياً لتفادي أخطاء الـ Build السابقة
      - name: Generate Package.json for Plain HTML
        run: |
          cat << 'EOF' > package.json
          {
            "name": "cnc-start-launcher",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'Web assets ready'"
            }
          }
          EOF

      # 4. تثبيت أداة Cordova وبناء تطبيق الأندرويد APK
      - name: Install Cordova and Build Android APK
        run: |
          npm install -g cordova
          npm install
          npm run build
          # بناء منصة الأندرويد واستخراج الـ APK
          cordova platform add android --nosave || echo "Platform already added or using local"
          cordova build android --debug

      # 5. رفع ملف الـ APK النهائي لتتمكن من تحميله مباشرة من موقع GitHub
      - name: Upload Android APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Launcher-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk

