name: Build Android APK

on:
  push:
    branches:
      - main # أو غيره باسم الفرع الخاص بك (مثل master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: '16'

      # هذه الخطوة تقوم بإنشاء ملف package.json تلقائياً لتخطي خطأ Missing script: build
      - name: Generate Dummy Package.json for Plain HTML
        run: |
          echo '{"name": "cnc-app", "version": "1.0.0", "scripts": {"build": "echo \x22Plain HTML App - No Build Required\x22"}}' > package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Web App Step
        run: npm run build

      - name: Setup Java Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # هنا يوضع أمر بناء وتصدير الـ APK الخاص بـ Cordova أو Capacitor أو الأداة المستخدمة لديك
      - name: Build Android Debug APK
        run: |
          echo "Building APK..."
          # ملاحظة: إذا كنت تستخدم أداة معينة لبناء الـ APK (مثل Cordova) تأكد من كتابة أمرها هنا
          # على سبيل المثال: npx cordova build android --debug

      - name: Upload Android APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ./**/*.apk # سيبحث عن ملف الـ APK الناتج ويقوم برفعه تلقائياً لتحميله
